[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    config: Configuration and health endpoint tests
    plan: Plan Mode API tests
    genui: Generative UI API tests
    agent: Agent Mode API tests
    redactor: Redactor / PII-scrubbing tests
    engine: Execution engine unit tests (DataPacket, FanOut, FanIn)
    live: Tests requiring real API keys — skipped when env vars are absent
